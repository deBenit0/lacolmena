# Publica en Releases el addon para la hermandad.
# Se pone en marcha cuando llega a main una versión nueva de HDFprofesiones (la del .toc):
# si esa versión aún no tiene release, empaqueta SOLO la carpeta HDFprofesiones en un ZIP y
# crea la release (con su etiqueta vX.Y.Z), lista para descomprimir en Interface\AddOns.
# (Las pruebas se pasan antes, en la rama de desarrollo.)
name: Publicar versión

on:
  push:
    branches:
      - main
    paths:
      - "HDFprofesiones/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión del addon
        id: version
        run: |
          v=$(sed -n 's/^## Version: *//p' HDFprofesiones/HDFprofesiones.toc | tr -d '\r')
          echo "Versión: $v"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Crear la release (o completarla)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # El "-forever" del nombre y el release.json hacen que WowUp lo reconozca para
          # WoW Forever y avise de las versiones nuevas.
          ZIP="HDFprofesiones-$TAG-forever.zip"
          zip -r -q "$ZIP" HDFprofesiones
          cat > release.json <<JSON
          {"releases":[{"name":"HDFprofesiones","version":"$TAG","filename":"$ZIP","nolib":false,"metadata":[{"flavor":"forever","interface":16001}]}]}
          JSON
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe: le pongo el ZIP para WowUp y el release.json."
            gh release upload "$TAG" "$ZIP" release.json --clobber
            exit 0
          fi
          cat > notas.md <<'NOTAS'
          ## Cómo instalarlo

          **Con WowUp (se actualiza solo):** *Get Addons → Install from URL* y pega
          `https://github.com/deBenit0/lacolmena`.

          **A mano:**
          1. Descarga **HDFprofesiones-*-forever.zip** (abajo, en *Assets*).
          2. Descomprímelo dentro de `World of Warcraft\_forever_\Interface\AddOns`.
             Debe quedar `AddOns\HDFprofesiones\HDFprofesiones.toc`.
          3. Si tenías una versión anterior, cierra el juego y borra antes la carpeta `HDFprofesiones` vieja.
          4. En el juego: ventana de hermandad (J) → pestaña del engranaje.

          Todos los de la hermandad deben tener la misma versión.
          NOTAS
          gh release create "$TAG" "$ZIP" release.json \
            --target "$GITHUB_SHA" \
            --title "Los hijos del Fundillo $TAG" \
            --notes-file notas.md

      # CurseForge (opcional): solo si el repositorio tiene el secreto CF_API_KEY y la variable
      # CF_PROJECT_ID (Settings → Secrets and variables → Actions). Sube el mismo ZIP marcado
      # para WoW Forever. Si la versión ya está subida, CurseForge la rechaza y no pasa nada.
      - name: Subir a CurseForge
        if: ${{ env.CF_API_KEY != '' && vars.CF_PROJECT_ID != '' }}
        continue-on-error: true
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          API=https://wow.curseforge.com/api
          ZIP="HDFprofesiones-$TAG-forever.zip"
          [ -f "$ZIP" ] || zip -r -q "$ZIP" HDFprofesiones
          # Tipo de versión de juego de WoW Forever y su versión más reciente.
          curl -sf -H "X-Api-Token: $CF_API_KEY" "$API/game/version-types" > types.json
          curl -sf -H "X-Api-Token: $CF_API_KEY" "$API/game/versions" > versions.json
          GV=$(python3 - <<'PY'
          import json
          types = json.load(open("types.json"))
          ids = [t["id"] for t in types if "forever" in (t.get("slug","") + t.get("name","")).lower()]
          vers = [v for v in json.load(open("versions.json")) if v.get("gameVersionTypeID") in ids]
          vers.sort(key=lambda v: v["id"])
          print(vers[-1]["id"] if vers else "")
          PY
          )
          if [ -z "$GV" ]; then echo "No encuentro la versión de juego de WoW Forever en CurseForge"; exit 1; fi
          META=$(printf '{"changelog":"Versión %s","changelogType":"text","displayName":"%s","releaseType":"release","gameVersions":[%s]}' "$TAG" "$TAG" "$GV")
          curl -sf -H "X-Api-Token: $CF_API_KEY" -F "metadata=$META" -F "file=@$ZIP" \
            "$API/projects/$CF_PROJECT_ID/upload-file"
          echo "Subido a CurseForge."
