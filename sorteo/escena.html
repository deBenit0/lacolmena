<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escena del sorteo</title>
<!--
  Escena para OBS (fuente de navegador 1920×1080). Transparente; al sortear desde
  el panel aparece un fondo negro con los nombres cayendo de arriba abajo.
  Opciones: ?anuncio=1  ?siempre=1  ?segundos=15  ?sonido=0  ?fondo=verde
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, "Segoe UI", sans-serif; color: #f2f2f5; }
  body.verde { background: #00b140; }
  #escena { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .6s; }
  #escena.visible { opacity: 1; }
  #titulo { position: absolute; left: 0; right: 0; top: 4vh; text-align: center; font-size: 6vh; font-weight: 900; letter-spacing: .14em; color: #fff;
    text-shadow: 0 0 3vh rgba(169, 112, 255, .8); }
  #lienzo { position: absolute; left: 50%; top: 18vh; width: 120vh; height: 72vh; transform: translateX(-50%); }
  #cartel { position: absolute; left: 0; right: 0; bottom: 4vh; text-align: center; opacity: 0; transform: translateY(3vh); transition: opacity .5s, transform .5s; }
  #cartel.visible { opacity: 1; transform: none; }
  #cartel .sup { font-size: 3.6vh; letter-spacing: .2em; text-transform: uppercase; color: #a970ff; font-weight: 800; }
  #cartel .inf { font-size: 2.6vh; color: #a3a3b2; margin-top: .6vh; }
  #confeti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #anuncio { position: absolute; left: 50%; bottom: 3vh; transform: translateX(-50%); display: none; white-space: nowrap;
    padding: 1.2vh 3vh; border-radius: 999px; background: rgba(0, 0, 0, .88); border: .3vh solid #a970ff; font-size: 3vh; }
  #anuncio b { color: #c4a0ff; }
  .durante-sorteo #anuncio { display: none !important; }
</style>
</head>
<body>
<div id="escena">
  <div id="titulo">SORTEO DEL FUNDILLO</div>
  <canvas id="lienzo"></canvas>
  <div id="cartel"><div class="sup">¡Tenemos ganador!</div><div class="inf" id="info"></div></div>
</div>
<div id="anuncio"></div>
<canvas id="confeti"></canvas>

<script src="js/nucleo.js"></script>
<script src="js/rodillo.js"></script>
<script src="js/enlace.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const siempre = q.get('siempre') === '1';
const anuncio = q.get('anuncio') === '1';
const segundos = parseInt(q.get('segundos'), 10) || 15;
if (q.get('fondo') === 'verde') document.body.classList.add('verde');
Animacion.Sonido.activo = q.get('sonido') !== '0';

const rodillo = new Animacion.Rodillo($('lienzo'));
let girando = false, ocultar = null;
if (siempre) $('escena').classList.add('visible');

function pintarEstado(s) {
  if (girando) return;
  rodillo.mostrar(s.participantes.map((p) => p.nombre));

  if (anuncio) {
    const a = $('anuncio');
    a.style.display = s.abierto ? 'block' : 'none';
    const palabra = (s.palabraClave || '').trim();
    const b = () => Object.assign(document.createElement('b'), { textContent: palabra });
    const textos = {
      igual: ['Escribe ', b(), ' para entrar al sorteo'],
      subs: ['Escribe ', b(), ' para entrar al sorteo · los subs tienen más opciones de ganar'],
      soloSubs: ['Sorteo solo para subs · escribe ', b(), ' para entrar'],
      gasto: ['Escribe ', b(), ' para entrar al sorteo · bits y subs te dan más opciones de ganar'],
    };
    a.replaceChildren(...(palabra ? (textos[s.modo] || textos.igual) : ['Bits, subs y regalos te meten en el sorteo']),
      ...(s.bonusTop ? [' · ', Object.assign(document.createElement('b'), { textContent: 'el top de regaladores tiene premio extra' })] : []));
  }
}

async function tirar({ tirada, inicio }) {
  clearTimeout(ocultar);
  girando = true;
  document.body.classList.add('durante-sorteo');
  $('cartel').classList.remove('visible');
  $('escena').classList.add('visible');
  await rodillo.girar(tirada, inicio);
  const g = tirada.ganador;
  $('info').textContent = `¡Enhorabuena, ${g.nombre}!`;
  $('cartel').classList.add('visible');
  Animacion.confeti($('confeti'), 6000);
  ocultar = setTimeout(() => {
    $('cartel').classList.remove('visible');
    if (!siempre) $('escena').classList.remove('visible');
    document.body.classList.remove('durante-sorteo');
    girando = false;
    Enlace.enviar({ tipo: 'hola' });
  }, segundos * 1000);
}

Enlace.escuchar((m) => {
  if (!m) return;
  if (m.tipo === 'estado') pintarEstado(m);
  else if (m.tipo === 'tirada') tirar(m);
});
Enlace.enviar({ tipo: 'hola' });
</script>
</body>
</html>
