<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escena del sorteo</title>
<!--
  Escena para OBS (fuente de navegador 1920×1080). Transparente; aparece al sortear desde el panel.
  Opciones: ?ranking=5  ?anuncio=1  ?siempre=1  ?segundos=15  ?sonido=0  ?fondo=verde
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, "Segoe UI", sans-serif; color: #f3ead8; }
  body.verde { background: #00b140; }
  #escena { position: absolute; inset: 0; opacity: 0; transform: scale(.85); transition: opacity .5s, transform .5s cubic-bezier(.2, 1.4, .4, 1); }
  #escena.visible { opacity: 1; transform: scale(1); }
  #titulo { position: absolute; left: 50%; top: 2.5vh; transform: translateX(-50%); padding: .5vh 3vh; border-radius: 999px;
    background: rgba(20, 17, 12, .9); border: .35vh solid #f5b301; font-size: 4.2vh; font-weight: 900; letter-spacing: .08em; color: #ffd24a; white-space: nowrap;
    box-shadow: 0 0 4vh rgba(245, 179, 1, .45); }
  #titulo small { font-size: 2.4vh; color: #b5a888; font-weight: 600; letter-spacing: 0; margin-left: 1.5vh; }
  #lienzo { position: absolute; left: 50%; top: 53%; width: 78vh; height: 78vh; transform: translate(-50%, -50%); }
  #cartel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.3); opacity: 0; text-align: center;
    padding: 3vh 7vh; border-radius: 3vh; background: rgba(20, 17, 12, .95); border: .6vh solid #f5b301; box-shadow: 0 0 10vh rgba(245, 179, 1, .7);
    transition: transform .6s cubic-bezier(.2, 1.6, .4, 1), opacity .3s; min-width: 60vh; }
  #cartel.visible { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  #cartel .sup { font-size: 3.4vh; letter-spacing: .12em; text-transform: uppercase; color: #ffd24a; }
  #cartel .nombre { font-size: 10vh; font-weight: 900; color: #f5b301; text-shadow: 0 .6vh 0 #000; line-height: 1.15; margin: 1vh 0; word-break: break-word; }
  #cartel .inf { font-size: 2.8vh; color: #b5a888; }
  #confeti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #ranking { position: absolute; right: 3vh; top: 14vh; min-width: 34vh; padding: 1.6vh 2vh; border-radius: 1.6vh; display: none;
    background: rgba(20, 17, 12, .88); border: .25vh solid #f5b301; font-size: 2.4vh; }
  #ranking h3 { margin: 0 0 1vh; font-size: 2vh; color: #ffd24a; text-transform: uppercase; letter-spacing: .1em; }
  #ranking div { display: flex; justify-content: space-between; gap: 2vh; padding: .3vh 0; }
  #ranking b { color: #f5b301; }
  #anuncio { position: absolute; left: 50%; bottom: 3vh; transform: translateX(-50%); display: none; white-space: nowrap;
    padding: 1.2vh 3vh; border-radius: 999px; background: rgba(20, 17, 12, .9); border: .3vh solid #f5b301; font-size: 3vh; animation: latido 2.4s ease-in-out infinite; }
  #anuncio b { color: #ffd24a; }
  @keyframes latido { 50% { box-shadow: 0 0 3vh rgba(245, 179, 1, .6); } }
</style>
</head>
<body>
<div id="escena">
  <div id="titulo">🐝 SORTEO DE LA COLMENA <small id="subtitulo"></small></div>
  <canvas id="lienzo"></canvas>
</div>
<div id="cartel"><div class="sup">🏆 ¡Tenemos ganador! 🏆</div><div class="nombre" id="nombre"></div><div class="inf" id="info"></div></div>
<div id="ranking"></div>
<div id="anuncio"></div>
<canvas id="confeti"></canvas>

<script src="js/nucleo.js"></script>
<script src="js/rueda.js"></script>
<script src="js/enlace.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const topN = parseInt(q.get('ranking'), 10) || 0;
const siempre = q.get('siempre') === '1';
const anuncio = q.get('anuncio') === '1';
const segundos = parseInt(q.get('segundos'), 10) || 15;
if (q.get('fondo') === 'verde') document.body.classList.add('verde');
Rueda.Sonido.activo = q.get('sonido') !== '0';

const ruleta = new Rueda.Ruleta($('lienzo'));
let girando = false, ocultar = null;
if (siempre) $('escena').classList.add('visible');

function pintarEstado(s) {
  if (girando) return;
  ruleta.mostrar(s.participantes.map((p) => ({ nombre: p.nombre, papeletas: p.papeletas })));
  $('subtitulo').textContent = `${s.participantes.length} participantes · ${s.totalPapeletas} papeletas`;

  if (topN) {
    const top = s.participantes.slice(0, topN);
    $('ranking').style.display = top.length ? 'block' : 'none';
    $('ranking').replaceChildren(Object.assign(document.createElement('h3'), { textContent: '🎟 Papeletas' }));
    for (const p of top) {
      const f = document.createElement('div');
      f.append(Object.assign(document.createElement('span'), { textContent: p.nombre }), Object.assign(document.createElement('b'), { textContent: p.papeletas }));
      $('ranking').append(f);
    }
  }
  if (anuncio) {
    const a = $('anuncio');
    a.style.display = s.abierto ? 'block' : 'none';
    const palabra = (s.palabraClave || '').trim();
    a.replaceChildren(...(palabra
      ? ['Escribe ', Object.assign(document.createElement('b'), { textContent: palabra }), ' para participar · bits y subs dan papeletas extra']
      : ['Bits, subs y regalos te dan papeletas para el sorteo']));
  }
}

async function tirar({ tirada, inicio }) {
  clearTimeout(ocultar);
  girando = true;
  $('cartel').classList.remove('visible');
  $('escena').classList.add('visible');
  $('subtitulo').textContent = `${tirada.segmentos.length} participantes · ${tirada.ganador.totalPapeletas} papeletas`;
  await ruleta.girar(tirada, inicio);
  const g = tirada.ganador;
  $('nombre').textContent = g.nombre;
  $('info').textContent = `${g.papeletas} de ${g.totalPapeletas} papeletas · ${(g.probabilidad * 100).toFixed(1)} % de probabilidad`;
  setTimeout(() => { $('cartel').classList.add('visible'); Rueda.confeti($('confeti'), 6000); }, 700);
  ocultar = setTimeout(() => {
    $('cartel').classList.remove('visible');
    if (!siempre) $('escena').classList.remove('visible');
    girando = false;
    Enlace.enviar({ tipo: 'hola' });
  }, segundos * 1000);
}

Enlace.escuchar((m) => {
  if (!m) return;
  if (m.tipo === 'estado') pintarEstado(m);
  else if (m.tipo === 'tirada') tirar(m);
});
Enlace.enviar({ tipo: 'hola' });
</script>
</body>
</html>
