<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Overlay sorteo</title>
<!--
  Fuente de navegador para OBS: http://localhost:3000/overlay  (ancho 1920, alto 1080)
  Es transparente y solo aparece cuando sacas un ganador desde el panel.
  Añade ?ranking=5 para mostrar siempre el top 5 de papeletas en una esquina.
-->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; }
  #caja { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; transition: opacity .4s, transform .4s;
    min-width: 640px; padding: 28px 48px; text-align: center; border-radius: 24px;
    background: rgba(20, 17, 12, .92); border: 4px solid #f5b301; box-shadow: 0 0 60px rgba(245, 179, 1, .5); color: #f3ead8; }
  #caja.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #titulo { font-size: 28px; letter-spacing: .1em; text-transform: uppercase; color: #ffd24a; }
  #nombre { font-size: 72px; font-weight: 900; margin: 10px 0; color: #f5b301; text-shadow: 0 4px 0 #000; }
  #info { font-size: 24px; color: #b5a888; min-height: 1.2em; }
  #nombre.final { animation: pum .9s ease-out; }
  @keyframes pum { 0% { transform: scale(.7); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  #ranking { position: absolute; right: 30px; top: 30px; min-width: 320px; padding: 14px 18px; border-radius: 14px;
    background: rgba(20, 17, 12, .85); border: 2px solid #f5b301; color: #f3ead8; font-size: 20px; display: none; }
  #ranking h3 { margin: 0 0 8px; font-size: 18px; color: #ffd24a; text-transform: uppercase; letter-spacing: .08em; }
  #ranking div { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; }
  #ranking b { color: #f5b301; }
</style>
</head>
<body>
<div id="caja"><div id="titulo">🐝 Sorteo de La Colmena</div><div id="nombre"></div><div id="info"></div></div>
<div id="ranking"></div>
<script>
const params = new URLSearchParams(location.search);
const topN = parseInt(params.get('ranking'), 10) || 0;
const segundosVisible = parseInt(params.get('segundos'), 10) || 15;
const caja = document.getElementById('caja');
const nombre = document.getElementById('nombre');
const info = document.getElementById('info');
const ranking = document.getElementById('ranking');
let ocultar;

function ruleta(candidatos, ganador) {
  clearTimeout(ocultar);
  const bolsa = candidatos.flatMap((c) => Array(Math.min(c.papeletas, 20)).fill(c.nombre));
  const pasos = 36;
  let i = 0;
  caja.classList.add('visible');
  nombre.classList.remove('final');
  info.textContent = `${candidatos.length} participantes · ${ganador.totalPapeletas} papeletas`;
  const tick = () => {
    if (i >= pasos) {
      nombre.textContent = '🏆 ' + ganador.nombre;
      void nombre.offsetWidth; nombre.classList.add('final');
      info.textContent = `¡Enhorabuena! Tenía ${ganador.papeletas} de ${ganador.totalPapeletas} papeletas`;
      ocultar = setTimeout(() => caja.classList.remove('visible'), segundosVisible * 1000);
      return;
    }
    nombre.textContent = bolsa[Math.floor(Math.random() * bolsa.length)];
    i++;
    setTimeout(tick, 45 + (i / pasos) ** 3 * 420);
  };
  tick();
}

function pintarRanking(s) {
  if (!topN) return;
  const top = s.participantes.filter((p) => p.papeletas > 0).slice(0, topN);
  ranking.style.display = top.length ? 'block' : 'none';
  ranking.replaceChildren(Object.assign(document.createElement('h3'), { textContent: '🎟 Papeletas' }));
  for (const p of top) {
    const fila = document.createElement('div');
    fila.append(Object.assign(document.createElement('span'), { textContent: p.nombre }),
      Object.assign(document.createElement('b'), { textContent: p.papeletas }));
    ranking.append(fila);
  }
}

const fuente = new EventSource('/api/eventos');
fuente.addEventListener('estado', (e) => pintarRanking(JSON.parse(e.data)));
fuente.addEventListener('ganador', (e) => { const d = JSON.parse(e.data); ruleta(d.candidatos, d.ganador); });
</script>
</body>
</html>
